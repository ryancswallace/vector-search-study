site_name: Vector Search Study
site_description: Benchmarks and analysis of exact vector search algorithms and implementations.
site_author: Ryan Wallace
site_url: https://ryancswallace.github.io/vector-search-study/
repo_name: ryancswallace/vector-search-study
repo_url: https://github.com/ryancswallace/vector-search-study
edit_uri: blob/main/docs/

docs_dir: docs
site_dir: site
strict: true

watch:
  - src/vector_search_study

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - stylesheets/navigation.css

theme:
  name: material
  locale: en
  font: false
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

exclude_docs: |
  _scripts/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/_scripts/gen_api_reference.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - How-to guides:
      - How-to guides overview: how-to/index.md
  - Reference:
      - Reference overview: reference/index.md
      - API:
          - Package: reference/api/index.md
          - API: reference/api/api.md
          - Exceptions: reference/api/exceptions.md
          - Benchmark definitions: reference/api/benchmarking.md
          - Faiss search: reference/api/faiss_search.md
          - NumPy search: reference/api/numpy_search.md
          - Python search: reference/api/python_search.md
          - Reference: reference/api/reference.md
          - SciPy search: reference/api/scipy_search.md
          - scikit-learn search: reference/api/sklearn_search.md
          - Synthetic data: reference/api/synthetic.md
          - PyTorch search: reference/api/torch_search.md
  - Explanation:
      - Explanation overview: explanation/index.md
      - Exact-search contract: explanation/exact-search-contract.md
      - Benchmark design: explanation/benchmark-design.md
      - Tooling: explanation/tooling.md
  - Maintainer runbooks:
      - Maintainer runbooks overview: runbooks/index.md
      - Release: runbooks/release.md
  - Project:
      - Development: project/development.md
      - Contributing: project/contributing.md
      - Changelog: project/changelog.md
