[project]
name = "vector-search-study"
version = "0.1.0"
description = "Benchmarks and analysis of exact vector search algorithms and implementations."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ryan Wallace", email = "ryancswallace@gmail.com" },
]
maintainers = [
    { name = "Ryan Wallace", email = "ryancswallace@gmail.com" },
]
keywords = [
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.11",

    "Programming Language :: Python :: 3.12",

    "Programming Language :: Python :: 3.13",

    "Programming Language :: Python :: 3.14",

    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2.6",
]

[project.urls]
Homepage = "https://github.com/ryancswallace/vector-search-study"
Changelog = "https://github.com/ryancswallace/vector-search-study/blob/main/CHANGELOG.md"
Documentation = "https://ryancswallace.github.io/vector-search-study/"
Issues = "https://github.com/ryancswallace/vector-search-study/issues"
Source = "https://github.com/ryancswallace/vector-search-study"

[dependency-groups]
benchmark = [
    "benchmatrix==1.2.0",
    "threadpoolctl>=3.6.0",
]
benchmark-backends = [
    "faiss-cpu==1.14.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.0",
    "torch==2.13.0; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]
test = [
    "hypothesis>=6.163.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
lint = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]
type = [
    "basedpyright>=1.39.9",
]
docs = [
    "linkchecker>=10.6.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-material>=9.7.7,<10",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6",
]
security = [
    "bandit[toml]>=1.9.4",
    "deptry>=0.25.1",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
    "zizmor>=1.28.0",
]
release = [
    "build>=1.5.0",
    "cyclonedx-bom>=7.3.1",
    "twine>=7.0.0",
]
automation = [
    "nox>=2026.7.11",
]
dev = [
    { include-group = "automation" },
    { include-group = "benchmark" },
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "release" },
    { include-group = "security" },
    { include-group = "test" },
    { include-group = "type" },
]

[tool.uv]
link-mode = "copy"
required-version = ">=0.11.8,<0.12"

[tool.uv.sources]
benchmatrix = { git = "https://github.com/ryancswallace/benchmatrix.git", rev = "109ecaa10ecd0fde23ce907aeebbb403f0d27bde" }  # pragma: allowlist secret
torch = [
    { index = "pytorch-cpu", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/docs",
    "/LICENSE",
    "/mkdocs.yml",
    "/noxfile.py",
    "/README.md",
    "/RELEASE.md",
    "/SECURITY.md",
    "/examples",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_search_study"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["src"]
empty_parameter_set_mark = "fail_at_collect"
xfail_strict = true
required_plugins = [
    "pytest-cov>=7.1.0",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=vector_search_study",
    "--cov-report=term-missing",
]
filterwarnings = [
    "error",
]
markers = [
    "integration: tests that exercise installed packages or third-party runtime integrations",
    "property: property-based tests powered by Hypothesis",
    "slow: tests that do packaging, subprocess, or otherwise slower work",
    "unit: fast isolated tests for local package behavior",
]
norecursedirs = [
    "*.egg",
    "*.egg-info",
    ".git",
    ".hypothesis",
    ".mypy_cache",
    ".nox",
    ".pyright",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "env",
    "htmlcov",
    "node_modules",
    "reports",
    "site",
    "venv",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["vector_search_study"]

[tool.coverage.paths]
source = [
    "src/vector_search_study",
    "*/site-packages/vector_search_study",
]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_empty = true
skip_covered = true

[tool.ruff]
line-length = 120
src = ["src", "tests", "examples", "scripts", "docs/_scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PT", "RET", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["vector_search_study"]

[tool.ruff.format]
line-ending = "lf"

[tool.basedpyright]
include = ["src", "tests", "examples", "scripts", "docs/_scripts", "noxfile.py"]
exclude = [".venv", "build", "dist", "node_modules"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.deptry]
ignore_notebooks = true
known_first_party = ["vector_search_study"]
